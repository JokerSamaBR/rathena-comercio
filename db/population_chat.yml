  # Colloquial variants are kept before broad rules so short chat messages
  # such as "oiii", "kkk", "brb" and "lol" can receive natural replies.
  # They are still data-only and use the same cooldown and distance checks.

  # ------------------------------
  # Portuguese — informal chat, slang and common typos
  # ------------------------------
