      Keywords: ["oie", "oiee", "oii", "oiii", "oiiiii", "olaaa", "olaaaa", "eae", "eaee", "opa", "opaa", "opaaa", "salve", "salve salve", "fala ae", "fala meu", "bomdiiia", "boaa tarde", "boaa noite", "blz", "blza", "beleza"]
